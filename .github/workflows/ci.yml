name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check syntax
        run: for f in *.js tests/*.js; do node --check "$f"; done
      - name: Check manifest
        run: node -e 'JSON.parse(require("fs").readFileSync("manifest.json"))'
      - name: Test
        run: node --test
